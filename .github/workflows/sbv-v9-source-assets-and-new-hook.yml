name: SBV V9 - Retrieve verified unique wildlife clips and resynthesize improved opening
on:
  push:
    branches: [sbv-zombie-ant-v9-final-master-20261027]
    paths-ignore:
      - sbv_v9_final_result.json
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get video source manifest from repository
        uses: actions/checkout@v4
      - name: FFmpeg preparation
        run: |
          set -euo pipefail
          python3 -m pip install -q imageio-ffmpeg
          python3 - <<'PY'
          import imageio_ffmpeg,os
          from pathlib import Path
          path=Path("bin").resolve();path.mkdir(exist_ok=True)
          (path/"ffmpeg").symlink_to(Path(imageio_ffmpeg.get_ffmpeg_exe()).resolve())
          with open(os.environ["GITHUB_PATH"],"a") as f:f.write(str(path)+"\n")
          PY
      - name: Download 7 distinct real outdoors sources and transcode for documentary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outdoor_raw v9_assets
          python3 - <<'PY'
          import subprocess,json
          from pathlib import Path
          clips=[
            (15942941,30,"macro_ant_stem"),
            (5000021,30,"ants_on_tree_trunk"),
            (4349443,30,"ants_moist_green_leaf"),
            (3111549,25,"forest_moss_bark"),
            (4500162,24,"macro_tree_bark"),
            (6754975,25,"moss_forest_stream"),
            (7645650,30,"sunlit_forest")
          ]
          sources=[]
          for id,fps,name in clips:
            url=f"https://videos.pexels.com/video-files/{id}/{id}-hd_1920_1080_{fps}fps.mp4"
            original=Path("outdoor_raw")/(name+".mp4")
            dest=Path("v9_assets")/(name+".mp4")
            subprocess.run(["curl","--fail","--location","--silent","--show-error","--retry","4","--retry-delay","2","--max-time","180","--connect-timeout","25","-A","Mozilla/5.0",url,"-o",str(original)],check=True)
            subprocess.run(["ffmpeg","-hide_banner","-v","error","-xerror","-y","-i",str(original),"-an",
                "-vf","scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,setsar=1,fps=30",
                "-c:v","libx264","-preset","veryfast","-crf","23","-pix_fmt","yuv420p","-movflags","+faststart",str(dest)],check=True)
            sources.append({"id":id,"fps_original":fps,"name":name,"uri":url,"bytes":dest.stat().st_size,"license":"Pexels free video license; illustrative (not infected)","source_confirmed":"Canva verified import"})
            print("ADDED UNIQUE",name,dest.stat().st_size,flush=True)
          Path("v9_assets/SOURCE_VIDEO_MANIFEST.json").write_text(json.dumps(sources,indent=2))
          PY
      - name: Upload genuine moving wildlife source files
        uses: actions/upload-artifact@v4
        with:
          name: SBV_V9_7_DISTINCT_REAL_WILDLIFE_VIDEO_SOURCES
          path: v9_assets/
          retention-days: 7
          if-no-files-found: error
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Python for same Kokoro voice as original
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original Kokoro v1.0 voice weights and dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -q "kokoro-onnx==0.6.1" "soundfile>=0.12,<1" "espeakng-loader" "numpy<3"
          mkdir -p model
          curl -fLSs --retry 5 --retry-delay 3 --max-time 450 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx" -o model/kokoro-v1.0.onnx
          curl -fLSs --retry 5 --retry-delay 3 --max-time 450 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin" -o model/voices-v1.0.bin
          echo "beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  model/kokoro-v1.0.onnx" | sha256sum --check --status
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  model/voices-v1.0.bin" | sha256sum --check --status
      - name: Generate new teaser that delays the central brain revelation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v9_opening
          python3 - <<'PY'
          from kokoro_onnx import Kokoro
          import soundfile as sf,numpy as np,json
          from pathlib import Path
          script=(
           "This ant is still alive. But something is already pulling it away from its colony. "
           "Soon, it will climb. It will clamp its jaws onto a leaf vein, and never let go. "
           "In this forest, death is only part of the story. "
           "The real mystery is how a fungus can make an animal do any of this."
          )
          tts=Kokoro("model/kokoro-v1.0.onnx","model/voices-v1.0.bin")
          audio,sr=tts.create(script,voice="af_heart",speed=0.88,lang="en-us",trim=False,continuous=True)
          audio=np.asarray(audio,dtype=np.float32).reshape(-1)
          assert sr==24000 and len(audio)>sr*14 and len(audio)<sr*34
          sf.write("v9_opening/00_COLD_OPEN_NEW.wav",audio,sr,subtype="PCM_24")
          Path("v9_opening/VOICE_AND_SCRIPT.json").write_text(json.dumps({"text":script,"voice":"kokoro-v1.0 af_heart","speed":0.88,"seconds":len(audio)/sr},indent=2))
          print("NEW NO-SPOILER INTRO",len(audio)/sr,"seconds",flush=True)
          PY
      - name: Upload new hook voice (does not reveal brain twist)
        uses: actions/upload-artifact@v4
        with:
          name: SBV_V9_KOKORO_REVISED_OPENING
          path: v9_opening/
          retention-days: 7
          if-no-files-found: error
