name: SBV V9 - New suspense hook in matching Kokoro af_heart voice
on:
  push:
    branches: [sbv-zombie-ant-v9-youtube-ready-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hook:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exactly matched Kokoro v1.0 onnx pipeline
        run: |
          python -m pip install -q 'kokoro-onnx==0.6.1' 'soundfile>=0.12,<1' 'espeakng-loader' 'numpy<3'
      - name: Retrieve verified voice weights
        run: |
          mkdir -p kokoro_model
          curl -fLSs --retry 4 --retry-delay 3 --max-time 420 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' -o kokoro_model/kokoro-v1.0.onnx
          curl -fLSs --retry 4 --retry-delay 3 --max-time 420 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o kokoro_model/voices-v1.0.bin
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  kokoro_model/kokoro-v1.0.onnx' | sha256sum -c
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  kokoro_model/voices-v1.0.bin' | sha256sum -c
      - name: Replace spoiler with open scientific mystery
        run: |
          python - <<'PY'
          from kokoro_onnx import Kokoro
          import numpy as np,soundfile as sf,json,pathlib
          script=("This ant is alive. But the way it moves isn't entirely its own. "
              "A parasite is guiding it toward one final act. "
              "It will climb. It will bite a leaf. And it will never let go. "
              "But why would a fungus need its victim to die in exactly the right place?")
          kk=Kokoro("kokoro_model/kokoro-v1.0.onnx","kokoro_model/voices-v1.0.bin")
          audio,sr=kk.create(script,voice="af_heart",speed=0.88,lang="en-us",trim=False,continuous=True)
          audio=np.asarray(audio,dtype=np.float32).reshape(-1)
          assert sr==24000 and len(audio)>sr*14 and np.isfinite(audio).all()
          out=pathlib.Path('hook_output');out.mkdir(exist_ok=True)
          sf.write(out/'V9_NEW_SUSPENSE_COLD_OPEN_AF_HEART.wav',audio,sr,subtype='PCM_24')
          (out/'V9_HOOK_TEXT.txt').write_text(script)
          print(json.dumps({'duration_s':len(audio)/sr,'voice':'af_heart','speed':0.88,'words':len(script.split())}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SBV_V9_NO_SPOILER_KOKORO_HOOK
          path: hook_output/
          retention-days: 7
          if-no-files-found: error
