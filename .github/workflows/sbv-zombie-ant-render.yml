name: SBV Zombie Ant – Kokoro af_heart Narration
on:
  push:
    branches:
      - sbv-zombie-ant-film-20261026
    paths-ignore:
      - production_result.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source for traceable production status
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro ONNX
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro-onnx==0.6.1" "soundfile>=0.12,<1" "espeakng-loader" "numpy<3"
      - name: Download verified Kokoro v1.0 weights
        run: |
          set -euo pipefail
          mkdir -p model
          curl -fLSs --retry 5 --retry-delay 3 --max-time 450 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx" -o model/kokoro-v1.0.onnx
          curl -fLSs --retry 5 --retry-delay 3 --max-time 450 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin" -o model/voices-v1.0.bin
          echo "beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  model/kokoro-v1.0.onnx" | sha256sum --check --status
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  model/voices-v1.0.bin" | sha256sum --check --status
          echo "Model SHA-256 verified."
      - name: Synthesize seven continuous chapter blocks
        run: |
          cat > narrate.py <<'PY'
          from kokoro_onnx import Kokoro
          import numpy as np
          import soundfile as sf
          from pathlib import Path
          import json
          import hashlib

          chapters = [
           ("00_COLD_OPEN", """This ant is alive. But the way it moves isn't entirely its own.
          A parasite is guiding it toward one final act.
          It will climb. It will bite a leaf. And it will never let go.
          Here's the part that sounds impossible.
          The fungus doing this doesn't even need to enter its brain."""),
           ("01_THE_INFECTION", """Deep in tropical forests, a group of fungi called Ophiocordyceps has evolved an extraordinary way to reproduce.
          Spores reach an unsuspecting ant, germinate, and penetrate its outer body.
          Inside, fungal cells multiply and spread through its tissues.
          For a while, the insect can look almost ordinary.
          But this isn't a parasite that simply kills its host.
          To complete its own life cycle, it needs the ant to die in the right place.
          Not deep inside a protected nest.
          On vegetation, in conditions favorable for fungal growth."""),
           ("02_THE_CLIMB", """In one carefully studied system in Thailand, infected carpenter ants lost their normal coordinated movement.
          They wandered alone. Some suffered repeated spasms and fell from plants.
          Then they climbed again.
          Researchers tracked the behavior of these insects in the wild.
          The final destination wasn't random.
          Low vegetation beneath the forest canopy created a humid place where the fungus could develop after the ant died.
          Different fungus species and host species can behave differently.
          But in the classic zombie-ant system, the next step is unmistakable."""),
           ("03_THE_DEATH_GRIP", """The ant closes its jaws around a leaf vein.
          And holds on.
          Even after death, the jaws can keep its body suspended in place.
          This is the famous death grip.
          Scientists have found profound changes in the muscles that operate those jaws.
          The fibers are damaged, and the infected muscles show signs of extreme contraction.
          The insect is no longer just an insect carrying a fungus.
          It has become the fungus's platform for reproduction.
          And the most disturbing discovery was still to come."""),
           ("04_THE_IMPOSSIBLE_DISCOVERY", """You might imagine fungal threads growing into the brain, like cables taking over a machine.
          But in a 2017 study, researchers examined infected ants with high-resolution imaging and three-dimensional reconstruction.
          They found fungal cells throughout the body, including around and sometimes inside muscle fibers.
          They even found interconnected networks of fungal cells.
          But they detected no fungal cells inside the brain.
          The apparent control doesn't require the fungus to physically invade that organ.
          That doesn't mean the brain is unaffected.
          Chemical signals and changes in the host's nervous system may still be involved.
          The precise mechanism remains under investigation.
          Scientists had found a parasite that could alter behavior while leaving the brain itself free of fungal cells.
          An animal turned into a puppet without the puppet master crawling into its head."""),
           ("05_AFTER_DEATH", """And the death of the ant isn't the end.
          The fungus continues developing inside the body.
          Eventually a reproductive stalk can emerge from behind the head.
          When mature, it releases spores into the surrounding habitat.
          Those spores create the opportunity for another infection.
          The forest gets back something very different from the ant that climbed onto the leaf.
          Not a resurrected creature.
          A dead host turned into a living fungus's reproductive structure."""),
           ("06_FINAL_TWIST", """The real horror isn't a fungus that eats brains.
          It's one that may be able to hijack a body's movements without ever entering the brain.
          And every strange detail of this story is real.
          Strange, but verified."""),
          ]
          output = Path("output")
          output.mkdir(exist_ok=True)
          kokoro = Kokoro("model/kokoro-v1.0.onnx", "model/voices-v1.0.bin")
          chunks = []
          pos = 0.0
          marks = []
          sr_final = None
          for i,(name,txt) in enumerate(chapters):
              # Continuous whole-chapter synthesis exactly as our prior SBV long-form projects
              audio,sr = kokoro.create(txt, voice="af_heart", speed=0.88, lang="en-us", trim=False, continuous=True)
              if sr_final is None: sr_final=sr
              assert sr_final == sr
              audio = np.asarray(audio, dtype=np.float32).reshape(-1)
              if len(audio)<sr*4 or not np.isfinite(audio).all():
                  raise RuntimeError(f"Invalid audio {name}")
              sf.write(output / f"{name}.wav", audio, sr, subtype="PCM_24")
              marks.append({"chapter":name,"start_sec":round(pos,3),"end_sec":round(pos+len(audio)/sr,3),"words":len(txt.split()),"duration_sec":round(len(audio)/sr,3)})
              chunks.append(audio)
              pos += len(audio)/sr
              if i != len(chapters)-1:
                  pause = 1.0 if i in (0,3,4) else 0.65
                  chunks.append(np.zeros(round(sr*pause),dtype=np.float32))
                  pos+=pause
          final=np.concatenate(chunks)
          sf.write(output/"SBV_ZOMBIE_ANT_KOKORO_AF_HEART_MASTER.wav", final,sr_final,subtype="PCM_24")
          (output/"chapter_timing.json").write_text(json.dumps(marks,indent=2))
          (output/"qa.json").write_text(json.dumps({
            "voice":"af_heart", "model":"Kokoro-82M v1.0", "speed":0.88,
            "continuous":True,"trim":False,"samplerate":sr_final,
            "duration_sec":round(len(final)/sr_final,3),
            "peak":float(np.max(np.abs(final))),
            "model_sha256":"beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a",
            "voices_sha256":"bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"
          },indent=2))
          print((output/"qa.json").read_text())
          PY
          python narrate.py
      - name: Upload all narration assets
        uses: actions/upload-artifact@v4
        with:
          name: SBV_ZOMBIE_ANT_KOKORO_AF_HEART_AUDIO
          path: output/
          retention-days: 7
          if-no-files-found: error

      - name: Render 1080p authentic footage MP4
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg || sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python sbv_render_video.py
      - name: Upload YouTube documentary master and QC
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SBV_ZOMBIE_ANT_FINAL_1080P_MP4
          path: |
            video_output/SBV_ZOMBIE_ANT_KOKORO_AF_HEART_MASTER.mp4
            video_output/captions_en.srt
            video_output/edl.json
            video_output/qa.json
            video_output/sources.json
            video_output/CREDITS.txt
          retention-days: 7
          if-no-files-found: error

      - name: Record verified production outcome
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          mp4=Path("video_output/SBV_ZOMBIE_ANT_KOKORO_AF_HEART_MASTER.mp4")
          w=Path("output/SBV_ZOMBIE_ANT_KOKORO_AF_HEART_MASTER.wav")
          info={
            "run_id": os.getenv("GITHUB_RUN_ID",""),
            "commit": os.getenv("GITHUB_SHA",""),
            "video_ready": mp4.is_file() and mp4.stat().st_size>10000000,
            "video_bytes": mp4.stat().st_size if mp4.is_file() else 0,
            "narration_ready": w.is_file(),
            "narration_bytes": w.stat().st_size if w.is_file() else 0,
            "artifact_name": "SBV_ZOMBIE_ANT_FINAL_1080P_MP4",
            "status": "success" if mp4.is_file() and mp4.stat().st_size>10000000 else "failed",
          }
          Path("production_result.json").write_text(json.dumps(info,indent=2))
          print(json.dumps(info,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production_result.json
          git commit -m "Record Zombie Ant documentary MP4 result for run $GITHUB_RUN_ID" || true
          git push origin HEAD:sbv-zombie-ant-film-20261026
