name: SBV Whale Lunge Research Footage QA
on:
  push:
    branches:
      - sbv-whales-20261024
    paths:
      - '.github/workflows/sbv-whales-engulfment.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Prepare analysis software
        run: |
          python -m pip install -q requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Review authentic feeding clips
        run: python sbv_whales/recover_engulfment.py
      - name: Save real clips and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbv-whales-real-engulfment
          path: |
            engulfment/*.wmv
            engulfment/*.mp4
            engulfment/contact.jpg
          retention-days: 3
          if-no-files-found: warn
