name: SBV Zombie Ant V10 - Extra Genuine Wild Footage with Public MP4
on:
  push:
    branches: [sbv-zombie-ant-v10-wild-extended-cut-20261027]
    paths-ignore: [sbv_v10_result.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout V10 editor
        uses: actions/checkout@v4
      - name: Install FFmpeg Kokoro ONNX and thumbnail tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q imageio-ffmpeg pillow "kokoro-onnx==0.6.1" "soundfile>=0.12,<1" espeakng-loader "numpy<3"
          python3 - <<'PY'
          import os,imageio_ffmpeg
          from pathlib import Path
          b=Path("ffmpeg_bin").resolve()
          b.mkdir(exist_ok=True)
          (b/"ffmpeg").symlink_to(Path(imageio_ffmpeg.get_ffmpeg_exe()).resolve())
          with open(os.environ["GITHUB_PATH"],"a") as f:f.write(str(b)+"\n")
          PY
          python3 -m py_compile sbv_v10_wild_directors_cut.py
      - name: Download public V8 original without GitHub Actions artifact-storage quota
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source fresh hook model
          curl -fLSs --retry 5 --retry-delay 5 --max-time 240 \
            'https://github.com/o0MrT0o/o0MrT0o.github.io/releases/download/sbv-zombie-ant-v8-forest-nature-20261027/SBV_ZOMBIE_ANT_V8_FOREST_ONLY_NO_LAB_NO_REPEATS.mp4' \
            -o source/SBV_ZOMBIE_ANT_V8_FOREST_ONLY_NO_LAB_NO_REPEATS.mp4
          test $(stat -c%s source/SBV_ZOMBIE_ANT_V8_FOREST_ONLY_NO_LAB_NO_REPEATS.mp4) -gt 100000000
      - name: Recover verified V8 20-shot source edit timeline from published study audit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          shotlist=[
           ('research_zombie',0,270,0,True),
           ('ants_on_leaves',0,204,0,False),
           ('ant_plant',0,120,0,False),
           ('research_healthy',1,360,0,False),
           ('ants_swarming',1,457,0,False),
           ('weaver_ants',1,360,0,False),
           ('pexels_3617015_black_ants_tree_branch',2,186,0,False),
           ('leaf_carrier',2,681,0,False),
           ('grass_ants',2,309,0,False),
           ('pexels_12633171_ants_on_wood_lush',3,450,0,False),
           ('pexels_3239802_ant_on_green_moss',3,437,0,False),
           ('black_ants',3,150,0,False),
           ('ant_colony1',4,840,0,False),
           ('ant_colony2',4,824,0,False),
           ('small_colony',4,157,0,False),
           ('mushrooms',5,354,0,False),
           ('mushroom_timelapse',5,420,0,False),
           ('moss',5,240,0,False),
           ('forestlog',6,330,0,False),
           ('red_mushroom',6,197,0,False),
          ]
          actual=[]
          cursor=0
          for name,chapter,frames,sourcein,scientific in shotlist:
            actual.append({'file_id':name,'chapter':chapter,'at':cursor/30,
             'frames':frames,'duration':frames/30,
             'source_in':5.51 if name=='research_zombie' else sourcein,
             'scientific':scientific})
            cursor+=frames
          assert cursor==7346 and len(actual)==20
          Path('source/V8_NO_REPEATS_NO_LAB_EDL.json').write_text(json.dumps(actual,indent=2))
          PY
          curl -fLSs --retry 4 --retry-delay 3 --max-time 90 \
            'https://github.com/o0MrT0o/o0MrT0o.github.io/releases/download/sbv-zombie-ant-v8-forest-nature-20261027/V8_FOREST_ONLY_QA.json' \
            -o source/V8_FOREST_ONLY_QA.json
      - name: Collect new separate nature footage directly from original Pexels video URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,subprocess,os,re,shutil
          from pathlib import Path
          expected={
           'ants_bark':('9888614',11.5),
           'ants_green_leaves':('4309877',11.2),
           'ants_dead_bug':('5000151',12.57),
           'ant_stem':('15942941',15.43),
           'ants_tree':('854966',17.17),
           'rain_leaf_ants':('4349443',10.3),
           'ants_leafy_branch':('10021035',11.8),
           'fungus_dead_leaf':('3224616',14.0),
           'leafcutter_trunk':('20494749',6.57)
          }
          target=Path('fresh')
          for name,(id,minimum) in expected.items():
            found=False;err=[]
            for fps in ('30','25','24','50','100'):
              for res in ('1920_1080','1280_720'):
                url=f'https://videos.pexels.com/video-files/{id}/{id}-hd_{res}_{fps}fps.mp4'
                path=target/(name+'.mp4')
                try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=45) as response,open(path,'wb') as o:shutil.copyfileobj(response,o,1024*1024)
                  if path.stat().st_size<100000:raise RuntimeError('tiny file')
                  ff=subprocess.run(['ffmpeg','-hide_banner','-i',str(path)],text=True,capture_output=True)
                  match=re.search(r'Duration:\s*(\d+):(\d+):(\d+(?:\.\d+)?)',ff.stderr)
                  if not match:raise RuntimeError('file not video')
                  dur=int(match[1])*3600+int(match[2])*60+float(match[3])
                  if dur<minimum:raise RuntimeError(f'insufficient {dur}s')
                  print('VALID NEW ORIGINAL OUTDOOR VIDEO',name,url,dur,flush=True)
                  found=True;break
                except Exception as e:
                  err.append(str(e)[:55])
                  if path.exists():path.unlink()
              if found:break
            if not found:raise RuntimeError(f'Unable to retrieve {name}: {err[:6]}')
          PY
      - name: Fetch original open-license documentary music and recorded forest ambience
        shell: bash
        run: |
          curl -fLSs --retry 5 --retry-delay 3 --max-time 100 \
            'https://files.freemusicarchive.org/storage-freemusicarchive-org/tracks/UDu2MITfQLDYrPAQl83OVpBn4ahW10HvNtHRn3kl.mp3' \
            -o fresh/score_dark_highway.mp3
          curl -fLSs --retry 5 --retry-delay 3 --max-time 100 \
            'https://bigsoundbank.com/UPLOAD/mp3/0100.mp3' \
            -o fresh/ambience_forest.mp3
      - name: Retrieve scientific primary source film of true fungus-controlled wild ant
        shell: bash
        run: |
          curl -fLSs --retry 5 --retry-delay 3 --max-time 130 \
            'https://media.springernature.com/original/springer-static/esm/art%3A10.1186%2F1472-6785-11-13/MediaObjects/12898_2011_173_MOESM2_ESM.MP4' \
            -o source/REAL_HUGHES_2011_OPHIOCORDYCEPS_THAILAND_ORIGINAL.mp4
          test -s source/REAL_HUGHES_2011_OPHIOCORDYCEPS_THAILAND_ORIGINAL.mp4
      - name: Synthesize matched new spoiler-free Kokoro af_heart opening
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 4 --max-time 400 \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx' \
            -o model/kokoro-v1.0.onnx
          curl -fLSs --retry 4 --max-time 400 \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' \
            -o model/voices-v1.0.bin
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  model/kokoro-v1.0.onnx' | sha256sum -c
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  model/voices-v1.0.bin' | sha256sum -c
          python3 - <<'PY'
          from kokoro_onnx import Kokoro
          import numpy as np,soundfile as sf
          script=("This ant is alive. But the way it moves isn't entirely its own. "
           "A parasite is guiding it toward one final act. "
           "It will climb. It will bite a leaf. And it will never let go. "
           "But why would a fungus need its victim to die in exactly the right place?")
          m=Kokoro('model/kokoro-v1.0.onnx','model/voices-v1.0.bin')
          audio,sr=m.create(script,voice='af_heart',speed=.88,lang='en-us',trim=False,continuous=True)
          audio=np.asarray(audio,dtype=np.float32).reshape(-1)
          assert sr==24000 and 15<len(audio)/sr<19.3
          sf.write('hook/V9_NEW_SUSPENSE_COLD_OPEN_AF_HEART.wav',audio,sr,subtype='PCM_24')
          print('NEW KOKORO HOOK seconds',len(audio)/sr)
          PY
      - name: Rebuild HD nature documentary with extra never-before-used rainforest infected ant footage
        shell: bash
        run: |
          set -euo pipefail
          python3 sbv_v10_wild_directors_cut.py
          ffmpeg -hide_banner -v error -xerror -i v10_output/SBV_ZOMBIE_ANT_V10_WILD_EXTENDED_YOUTUBE_FINAL.mp4 -f null -
      - name: Upload independently audited final video and YouTube publication kit
        uses: actions/upload-artifact@v4
        with:
          name: SBV_V10_REAL_WILD_INFECTION_DIRECT_DOC
          path: v10_output/
          retention-days: 7
          if-no-files-found: error
      - name: Publish a verified public direct MP4 link and description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create sbv-zombie-ant-v10-extra-authentic-wild-20261027 \
            v10_output/SBV_ZOMBIE_ANT_V10_WILD_EXTENDED_YOUTUBE_FINAL.mp4 \
            v10_output/SUBTITLES_EN.srt \
            v10_output/YOUTUBE_DESCRIPTION_AND_SOURCES.txt \
            v10_output/YOUTUBE_THUMBNAIL_1280x720.jpg \
            v10_output/FINAL_REVIEW_QA.json \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Strange, But Verified — Zombie Ants V10: The Extended Wild Documentary" \
            --notes "Polished HD documentary including 5 additional original non-overlapping seconds of genuinely Ophiocordyceps-infected ant recorded in nature by Hughes et al. (2011), CC BY 2.0. These are NEW frames from the SAME 2011 scientific research video, not another independent study. Nine more separate ordinary wild ant and forest source videos, clearly illustrative, reduce visual repetition; new matching Kokoro hook, no red mushroom finale, subtitles, thumbnail and music/nature. Not published to YouTube."
      - name: Record verified build details
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          file=Path("v10_output/SBV_ZOMBIE_ANT_V10_WILD_EXTENDED_YOUTUBE_FINAL.mp4")
          qa=Path("v10_output/FINAL_REVIEW_QA.json")
          status={"run_id":os.getenv("GITHUB_RUN_ID"),"video_exists":file.is_file(),
          "file_bytes":file.stat().st_size if file.is_file() else 0,
          "qa":json.loads(qa.read_text()) if qa.is_file() else None}
          Path("sbv_v10_result.json").write_text(json.dumps(status,indent=2))
          print(json.dumps(status,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sbv_v10_result.json
          git commit -m "Record full final V10 zombie-ant field-footage run" || true
          git push origin HEAD:sbv-zombie-ant-v10-wild-extended-cut-20261027
