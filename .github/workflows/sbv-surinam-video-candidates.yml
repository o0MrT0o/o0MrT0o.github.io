name: SBV Surinam animal birth original video previews
on:
  push:
    branches: [sbv-surinaam-toad-real-birth-20261109]
    paths:
      - sbv_surinam_video_candidates.py
      - .github/workflows/sbv-surinam-video-candidates.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install -q -U yt-dlp Pillow
          ffmpeg -version | head -1
      - name: Retrieve original footage previews and attribution information
        run: python3 -u sbv_surinam_video_candidates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SBV_Surinam_Footage_Candidates
          path: surinam_video_candidates/
          retention-days: 2
