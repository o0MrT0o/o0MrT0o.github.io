name: SBV Eel and Army Ant HD Test
on:
  push:
    branches:
      - sbv-necrobotics-temp-20261022
    paths:
      - '.github/workflows/sbv-candidate-quality.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          python -m pip install -q requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Probe actual supplementary videos
        run: python sbv_yellowstone/candidate_hd_audit.py
      - name: Save manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbv-eel-ants-quality-test
          path: sbv_candidate_quality/manifest.json
          if-no-files-found: warn
          retention-days: 3
