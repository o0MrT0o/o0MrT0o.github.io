name: SBV Hydrothermal Authentic NOAA Sources
on:
  push:
    branches: [sbv-hydrothermal-longform-20261025]
    paths: ['.github/workflows/sbv-vents-sources.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install source-review tools
        run: |
          python -m pip install -q requests beautifulsoup4 pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Extract authentic NOAA HD moving scenes
        run: python sbv_vents/recover_noaa_sources.py
      - name: Preserve source shots and credits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbv-vents-noaa-source-shots
          path: |
            source_media/*_??.mp4
            source_media/sources_manifest.json
            source_media/source_contacts.jpg
          retention-days: 3
          if-no-files-found: warn
