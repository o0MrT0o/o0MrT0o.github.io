name: Render SBV af_heart V2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kokoro runtime
        run: |
          python -m pip install --upgrade pip
          pip install 'kokoro-onnx==0.6.1' soundfile
      - name: Download exact approved model files
        run: |
          curl -L --fail --retry 3 -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -L --fail --retry 3 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin' | sha256sum -c -
      - name: Generate narration
        env:
          ORT_DISABLE_TELEMETRY: '1'
        run: |
          cat > render.py <<'PY'
          import hashlib, json, dataclasses
          import numpy as np
          import soundfile as sf
          import onnxruntime as ort
          from kokoro_onnx import Kokoro

          ort.disable_telemetry_events()
          script = "Watch the smaller vortex. It's about to disappear. The larger one was about sixty-five meters wide. The smaller one? Five. Dust devils themselves aren't rare on Mars. Perseverance and Curiosity have seen them across very different terrain. Sunlight heats the ground. Warm air rises and starts to spin, pulling dust upward through Mars's thin atmosphere. And sometimes, a larger vortex overtakes a smaller one."
          opt=ort.SessionOptions(); opt.intra_op_num_threads=4; opt.inter_op_num_threads=1
          session=ort.InferenceSession('kokoro-v1.0.onnx', sess_options=opt, providers=['CPUExecutionProvider'])
          k=Kokoro.from_session(session,'voices-v1.0.bin')
          phonemes=k.tokenizer.phonemize(script,lang='en-us')
          audio,sr,times=k.create_timed(phonemes,voice='af_heart',speed=0.88,lang='en-us',is_phonemes=True,trim=False,continuous=True)
          sf.write('mars_v2_af_heart.wav',audio,sr,subtype='PCM_24')
          with open('phoneme_times.json','w') as f: json.dump([dataclasses.asdict(t) for t in times],f,indent=2)
          meta={'model':'Kokoro-82M v1.0','implementation':'kokoro-onnx==0.6.1','voice':'af_heart','speed':0.88,'lang':'en-us','continuous':True,'trim':False,'sample_rate':sr,'duration':len(audio)/sr,'words':len(script.split()),'wav_sha256':hashlib.sha256(open('mars_v2_af_heart.wav','rb').read()).hexdigest(),'model_sha256':hashlib.sha256(open('kokoro-v1.0.onnx','rb').read()).hexdigest(),'voices_sha256':hashlib.sha256(open('voices-v1.0.bin','rb').read()).hexdigest(),'post_synthesis_speed_or_pitch_change':False,'script':script}
          with open('voice_meta.json','w') as f: json.dump(meta,f,indent=2)
          print(json.dumps(meta,indent=2))
          PY
          python render.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbv-mars-v2-af-heart
          path: |
            mars_v2_af_heart.wav
            phoneme_times.json
            voice_meta.json
          retention-days: 1
