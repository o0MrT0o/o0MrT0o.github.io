name: Render Living Rainbows Production Assets
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install 'kokoro-onnx==0.6.1' soundfile
      - name: Download exact approved Kokoro
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -L --fail --retry 3 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  kokoro-v1.0.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin' | sha256sum -c -
      - name: Download documentary assets
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 -o assets/decoherence.mp3 'https://www.scottbuckley.com.au/library/wp-content/uploads/2022/03/sb_decoherence.mp3'
          curl -L --fail --retry 3 -o assets/deep_discoverer_context.mp4 'https://oceanexplorer.noaa.gov/wp-content/uploads/2020/06/d2-1280x720-1.mp4'
          curl -L --fail --retry 3 -o assets/beroid_feeding.webp 'https://ocean.si.edu/sites/default/files/styles/full_width_large/public/2023-11/beroid-feeding.jpg.webp?itok=h9L29O6-'
          file assets/*
          sha256sum assets/* > assets/SHA256SUMS.txt
      - name: Generate all native af_heart blocks
        env:
          ORT_DISABLE_TELEMETRY: '1'
        run: |
          cat > render.py <<'PY'
          import hashlib, json, dataclasses, os
          import soundfile as sf
          import onnxruntime as ort
          from kokoro_onnx import Kokoro

          ort.disable_telemetry_events()
          speech_blocks = {"N0": "This rainbow is alive. And those moving stripes are not glowing. They are scattering light from the robot's lamps.\n\nThe animal is a comb jelly. It looks like something designed to be noticed. Yet some of its relatives carry a red stomach that helps conceal a meal capable of producing light.\n\nThe beautiful part is easy to see. The strange part takes a closer look. How does a transparent animal swim, catch food, and stay hidden in a world where a little light can give it away?", "N1": "Watch the rows running along the body. The colors move as the animal moves, which makes them look like a sequence of tiny lights.\n\nBut this rainbow is an optical effect. The rows are lined with comb plates made from moving, hair-like structures called cilia. Light from the vehicle interacts with those structures and scatters into different colors.\n\nThat distinction matters. A rainbow shimmer and bioluminescence are different things. Many comb jellies can produce light, but that does not make every colorful stripe a glowing organ.\n\nWe are looking at an animal under artificial illumination. The camera is showing us something real, while also changing the conditions in which we see it.", "N2": "The same structures that produce the shimmer also help the animal move. Along eight rows, the combs beat through the water.\n\nThink of tiny oars working across a soft body. The rainbow is catching our attention, but the movement underneath it is doing the useful work.\n\nDespite the name, a comb jelly is not a true jellyfish. The two belong to different animal groups. A familiar jellyfish pulses a swimming bell. A comb jelly uses those beating comb rows.\n\nThe distinction becomes clearer when you stop looking only at the outline. Watch what moves, where the movement starts, and what the rest of the body does. A shape that looks decorative suddenly becomes a working animal.", "N3": "And it is a hunter. Being soft and nearly transparent does not make an animal harmless to its food.\n\nMany comb jellies spread tentacles that carry sticky cells. Small prey caught on those tentacles can be brought towards the mouth. Others use broad lobes and cilia-generated currents to help deliver food.\n\nThen there are comb jellies in the group BEH-roh-ee. They have no long fishing tentacles. They have a large mouth, and some feed on other comb jellies. They can take a bite or swallow prey whole.\n\nSo when a transparent shape drifts past, look for more than its color. Look for the parts it uses to catch a meal. Those details can tell you more than its jelly-like appearance.", "N4": "A transparent hunter has another problem. Its meal may be more visible than its body.\n\nSome deep-sea comb jellies have a crimson stomach. That color helps conceal light-producing prey after it has been swallowed. Otherwise, a recent meal could draw attention from another predator.\n\nWhy red? Near the surface, red can be conspicuous. At depth, the available light is different. Water removes red light relatively quickly. Without red illumination to reflect, a red body can appear dark.\n\nThe robot's white lights reveal the color to us. They do not prove the animal looks equally bright to a neighbor in its natural surroundings.\n\nFor these animals, color is not just decoration. It can help keep dinner from advertising the diner.", "N5": "Now look at a different member of the group. The outline has changed. So have the proportions and the position of its tentacles.\n\nComb jellies are not one design repeated across the ocean. Some are rounded. Some have broad lobes. Others trail two long tentacles. There are even forms that live on the seafloor rather than spending their lives swimming through open water.\n\nThat variety is why a beautiful silhouette is not enough to identify a species. The details matter. And sometimes, those details lead to an animal that science has never formally described.", "N6": "In 2015, a NOAA expedition near Puerto Rico filmed three unusual comb jellies nearly four kilometers below the surface.\n\nThe vehicle did not have the capability to collect a specimen at the time. What the scientists had was video. They examined the images, compared the animal with earlier descriptions, and documented its distinctive features.\n\nThe result was published in 2020. The animal was named doo-oh-BRAY-kee-um SPARK-see. It was the first time NOAA used video alone to formally describe a new genus and species.\n\nThe footage became the evidence behind the description. But it did not answer every question. The researchers still had limited observations, and they did not establish the animal's complete ecological role.\n\nThat is an important difference between discovery and understanding. A camera can show that an unfamiliar animal is there. Learning how it lives can require much more than a memorable encounter.", "N7": "The rainbow looks different now.\n\nThe moving combs are part of a swimming system. The soft body belongs to a predator. In some relatives, a red stomach helps hide the light of a meal. And a camera can turn one fleeting encounter into evidence of a new species.\n\nThese animals do not need to be made stranger than they are. We just need to look carefully enough to see what the beautiful image is actually telling us."}
          display_blocks = {"N0": "This rainbow is alive. And those moving stripes are not glowing. They are scattering light from the robot's lamps.\n\nThe animal is a comb jelly. It looks like something designed to be noticed. Yet some of its relatives carry a red stomach that helps conceal a meal capable of producing light.\n\nThe beautiful part is easy to see. The strange part takes a closer look. How does a transparent animal swim, catch food, and stay hidden in a world where a little light can give it away?", "N1": "Watch the rows running along the body. The colors move as the animal moves, which makes them look like a sequence of tiny lights.\n\nBut this rainbow is an optical effect. The rows are lined with comb plates made from moving, hair-like structures called cilia. Light from the vehicle interacts with those structures and scatters into different colors.\n\nThat distinction matters. A rainbow shimmer and bioluminescence are different things. Many comb jellies can produce light, but that does not make every colorful stripe a glowing organ.\n\nWe are looking at an animal under artificial illumination. The camera is showing us something real, while also changing the conditions in which we see it.", "N2": "The same structures that produce the shimmer also help the animal move. Along eight rows, the combs beat through the water.\n\nThink of tiny oars working across a soft body. The rainbow is catching our attention, but the movement underneath it is doing the useful work.\n\nDespite the name, a comb jelly is not a true jellyfish. The two belong to different animal groups. A familiar jellyfish pulses a swimming bell. A comb jelly uses those beating comb rows.\n\nThe distinction becomes clearer when you stop looking only at the outline. Watch what moves, where the movement starts, and what the rest of the body does. A shape that looks decorative suddenly becomes a working animal.", "N3": "And it is a hunter. Being soft and nearly transparent does not make an animal harmless to its food.\n\nMany comb jellies spread tentacles that carry sticky cells. Small prey caught on those tentacles can be brought towards the mouth. Others use broad lobes and cilia-generated currents to help deliver food.\n\nThen there are comb jellies in the group Beroe. They have no long fishing tentacles. They have a large mouth, and some feed on other comb jellies. They can take a bite or swallow prey whole.\n\nSo when a transparent shape drifts past, look for more than its color. Look for the parts it uses to catch a meal. Those details can tell you more than its jelly-like appearance.", "N4": "A transparent hunter has another problem. Its meal may be more visible than its body.\n\nSome deep-sea comb jellies have a crimson stomach. That color helps conceal light-producing prey after it has been swallowed. Otherwise, a recent meal could draw attention from another predator.\n\nWhy red? Near the surface, red can be conspicuous. At depth, the available light is different. Water removes red light relatively quickly. Without red illumination to reflect, a red body can appear dark.\n\nThe robot's white lights reveal the color to us. They do not prove the animal looks equally bright to a neighbor in its natural surroundings.\n\nFor these animals, color is not just decoration. It can help keep dinner from advertising the diner.", "N5": "Now look at a different member of the group. The outline has changed. So have the proportions and the position of its tentacles.\n\nComb jellies are not one design repeated across the ocean. Some are rounded. Some have broad lobes. Others trail two long tentacles. There are even forms that live on the seafloor rather than spending their lives swimming through open water.\n\nThat variety is why a beautiful silhouette is not enough to identify a species. The details matter. And sometimes, those details lead to an animal that science has never formally described.", "N6": "In 2015, a NOAA expedition near Puerto Rico filmed three unusual comb jellies nearly four kilometers below the surface.\n\nThe vehicle did not have the capability to collect a specimen at the time. What the scientists had was video. They examined the images, compared the animal with earlier descriptions, and documented its distinctive features.\n\nThe result was published in 2020. The animal was named Duobrachium sparksae. It was the first time NOAA used video alone to formally describe a new genus and species.\n\nThe footage became the evidence behind the description. But it did not answer every question. The researchers still had limited observations, and they did not establish the animal's complete ecological role.\n\nThat is an important difference between discovery and understanding. A camera can show that an unfamiliar animal is there. Learning how it lives can require much more than a memorable encounter.", "N7": "The rainbow looks different now.\n\nThe moving combs are part of a swimming system. The soft body belongs to a predator. In some relatives, a red stomach helps hide the light of a meal. And a camera can turn one fleeting encounter into evidence of a new species.\n\nThese animals do not need to be made stranger than they are. We just need to look carefully enough to see what the beautiful image is actually telling us."}

          opt=ort.SessionOptions(); opt.intra_op_num_threads=4; opt.inter_op_num_threads=1
          session=ort.InferenceSession('kokoro-v1.0.onnx', sess_options=opt, providers=['CPUExecutionProvider'])
          k=Kokoro.from_session(session,'voices-v1.0.bin')
          os.makedirs('voice', exist_ok=True)
          meta={}
          for name,text in speech_blocks.items():
              phonemes=k.tokenizer.phonemize(text,lang='en-us')
              audio,sr,times=k.create_timed(phonemes,voice='af_heart',speed=0.88,lang='en-us',is_phonemes=True,trim=False,continuous=True)
              wav=f'voice/{name}.wav'
              sf.write(wav,audio,sr,subtype='PCM_24')
              with open(f'voice/{name}_times.json','w') as f:
                  json.dump([dataclasses.asdict(t) for t in times],f,indent=2)
              meta[name]={
                  'display_text':display_blocks[name],
                  'speech_text':text,
                  'sample_rate':sr,
                  'duration':len(audio)/sr,
                  'words':len(display_blocks[name].split()),
                  'wav_sha256':hashlib.sha256(open(wav,'rb').read()).hexdigest()
              }
          meta['profile']={
             'model':'Kokoro-82M v1.0','implementation':'kokoro-onnx==0.6.1',
             'voice':'af_heart','speed':0.88,'lang':'en-us','continuous':True,'trim':False,
             'model_sha256':hashlib.sha256(open('kokoro-v1.0.onnx','rb').read()).hexdigest(),
             'voices_sha256':hashlib.sha256(open('voices-v1.0.bin','rb').read()).hexdigest(),
             'post_synthesis_speed_or_pitch_change':False
          }
          with open('voice/voice_meta.json','w') as f: json.dump(meta,f,indent=2)
          print(json.dumps(meta,indent=2))
          PY
          python render.py
      - name: Upload production assets
        uses: actions/upload-artifact@v4
        with:
          name: living-rainbows-production-assets
          path: |
            voice/
            assets/
          retention-days: 1
