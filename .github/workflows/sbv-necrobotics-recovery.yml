name: SBV Necrobotics Source Recovery
on:
  push:
    branches:
      - sbv-necrobotics-temp-20261022
    paths:
      - '.github/workflows/sbv-necrobotics-recovery.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Ensure dependencies
        run: |
          python -m pip install -q requests
          ffmpeg -version | head -2
      - name: Retrieve original scientific supplementary video files
        run: python sbv_necrobotics/recover_necro.py
      - name: Save recovered evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbv-necrobotics-source-recovery
          path: |
            sources/
            recovery_log.txt
          if-no-files-found: warn
          retention-days: 3
