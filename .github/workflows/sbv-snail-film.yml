name: SBV Long Film — Zombie Snail Parasite
on:
  push:
    branches: [sbv-whales-20261024]
    paths: ['.github/workflows/sbv-snail-film.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install media and voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install -q requests pillow soundfile kokoro
      - name: Download verified footage
        run: python sbv_whales/build_snail_film.py
      - name: Render narration, subtitles and film
        run: python sbv_whales/render_snail_film.py
      - name: Upload film package
        uses: actions/upload-artifact@v4
        with:
          name: SBV_ZOMBIE_SNAIL_LONG_FILM
          path: |
            snail_film/SBV_ZOMBIE_SNAIL_PARASITE_LONG_FILM.mp4
            snail_film/SBV_ZOMBIE_SNAIL_COVER.jpg
            snail_film/SBV_ZOMBIE_SNAIL_EN.srt
            snail_film/SBV_ZOMBIE_SNAIL_DESCRIPTION.txt
            snail_film/SBV_ZOMBIE_SNAIL_QA.md
            snail_film/SBV_ZOMBIE_SNAIL_CONTACT.jpg
          retention-days: 7
# trigger: production run 2
