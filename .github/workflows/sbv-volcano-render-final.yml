name: SBV FINAL volcanic whirlwind TikTok video 1080p Public Domain
on:
  push:
    branches: [sbv-volcanic-whirlwinds-actual-video-20261111]
    paths:
      - sbv_volcano_render_final.py
      - .github/workflows/sbv-volcano-render-final.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools and verified original voice model
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q 'kokoro-onnx==0.6.1' 'soundfile>=0.12,<1' 'numpy<3' 'scipy>=1.10,<2' 'pillow>=10,<13' espeakng-loader
          mkdir -p models
          curl -fLSs --retry 5 --retry-delay 4 --max-time 500 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx -o models/kokoro-v1.0.onnx
          curl -fLSs --retry 5 --retry-delay 4 --max-time 500 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin -o models/voices-v1.0.bin
          echo 'beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a  models/kokoro-v1.0.onnx' | sha256sum --check
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  models/voices-v1.0.bin' | sha256sum --check
      - name: Render official USGS 1080p short, 7 cuts, English VO and mix, QA full-decode
        run: python3 -u sbv_volcano_render_final.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SBV_VOLCANO_WHIRLWIND_1080P_AND_MOBILE_FINAL_USGS_PUBLIC_DOMAIN
          path: sbv_volcano_final/
          retention-days: 5
