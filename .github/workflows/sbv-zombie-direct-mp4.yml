name: Publish SBV Zombie Ant direct MP4 link
on:
  push:
    branches: [sbv-zombie-ant-share-mp4-20261026]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify completed documentary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p master
          gh run download 40309917775 --repo "$GITHUB_REPOSITORY" -n SBV_ZOMBIE_ANT_DOCUMENTARY_V2_NO_REPEATS_1080P -D master
          ls -lh master/
          test -s master/SBV_ZOMBIE_ANT_DOCUMENTARY_NO_REPEATS_MASTER.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 master/SBV_ZOMBIE_ANT_DOCUMENTARY_NO_REPEATS_MASTER.mp4
          ffmpeg -hide_banner -v error -xerror -i master/SBV_ZOMBIE_ANT_DOCUMENTARY_NO_REPEATS_MASTER.mp4 -f null -
      - name: Publish just the MP4 as a dedicated preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create sbv-zombie-ant-no-repeat-mp4-20261026 master/SBV_ZOMBIE_ANT_DOCUMENTARY_NO_REPEATS_MASTER.mp4 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Strange But Verified - Zombie Ant documentary preview" --notes "Full documentary MP4, 1080p 30fps, Kokoro af_heart, 20 distinct moving-footage sources, no duplicated source clips. This is a downloadable preview, not a YouTube publication." --latest=false
          gh release view sbv-zombie-ant-no-repeat-mp4-20261026 --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].url'
