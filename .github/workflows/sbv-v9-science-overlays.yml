name: SBV V9 - Six real science picture-in-picture overlays
on:
  push:
    branches: [sbv-zombie-ant-v9-scientific-overlays-20261028]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install image composition libraries
        run: |
          python3 -m pip install --disable-pip-version-check -q pillow
          python3 -m py_compile generate_sbv_scientific_overlays.py
      - name: Create 6 original small overlays from scientific photographic sources
        run: |
          python3 generate_sbv_scientific_overlays.py
          test -s SBV_V9_SCIENCE_OVERLAY_ASSET_PACK.zip
          test -s scientific_overlay_pack/01_REAL_INFECTED_ANT.png
          test -s scientific_overlay_pack/06_SPORE_SCHEMATIC.png
      - name: Archive ready-to-use overlay PNG files and science credits
        uses: actions/upload-artifact@v4
        with:
          name: SBV_V9_SIX_SCIENCE_OVERLAYS_TRANSPARENT
          path: |
            SBV_V9_SCIENCE_OVERLAY_ASSET_PACK.zip
            scientific_overlay_pack/*.png
            scientific_overlay_pack/*.txt
            scientific_overlay_pack/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish verified source-backed overlay asset ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload sbv-zombie-ant-v9-science-overlays-20261028 \
            scientific_overlay_pack/*.png \
            --repo "${{ github.repository }}" --clobber
