name: Fetch Mars Dust Assets
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download NASA/JPL source media
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 -o assets/PIA24039_curiosity2020.gif 'https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia24/pia24039/PIA24039.gif'
          curl -L --fail --retry 3 -o assets/PIA21481_dune2017.gif 'https://assets.science.nasa.gov/content/dam/science/psd/mars/downloadable_items/3/9/39617_martian-dust-devil-pia21481.gif'
          curl -L --fail --retry 3 -o assets/PIA26074_thorofare.gif 'https://commons.wikimedia.org/wiki/Special:Redirect/file/PIA26074-MarsPerseveranceRover-Whirlwind-20230830.gif'
          curl -L --fail --retry 3 -o assets/PIA25290_multiple.gif 'https://commons.wikimedia.org/wiki/Special:Redirect/file/PIA25290_Perseverance_Views_Dust_Devils_Swirling_Across_Jezero_Crater.gif'
          file assets/*
          sha256sum assets/* > assets/SHA256SUMS.txt
      - name: Validate media types
        run: |
          for f in assets/*.gif; do file "$f" | grep -q 'GIF image data'; done
      - name: Upload source media
        uses: actions/upload-artifact@v4
        with:
          name: mars-dust-source-media-v3
          path: assets/
          retention-days: 1
